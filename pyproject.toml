[project]
name = "automatic-backup"
version = "0.1.0"
description = "A project for automatic backup with Python."
requires-python = ">=3.10"
dependencies = [
    "pandas[excel]",
    "pathspec",
    "sqlitedict",
    "ttkwidgets",
]

[dependency-groups]
dev = [
    "ipykernel",
    "mypy",
    "pytest",
    "ruff",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["**/.venv/**"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "D",
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # quotes
    "Q",
]

ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D205",
    "D212",
    "D400",
    "D415",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


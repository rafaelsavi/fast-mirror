name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Quality Gate (Pytest & Ruff)
        run: |
          uv run ruff check .
          uv run pytest

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Executable, Portable ZIP, and Setup Wizard
        run: uv run python packaging/build.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FastMirror ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*-Windows-Setup.exe
            dist/*-Windows-Portable.zip
          body: |
            ## FastMirror ${{ github.ref_name }}
            
            High-performance one-way directory synchronization and backup tool for Windows.

            ### Downloads
            - **`FastMirror-v*-Windows-Setup.exe`** (Recommended): Standard Windows installation wizard with Desktop and Start Menu shortcuts.
            - **`FastMirror-v*-Windows-Portable.zip`**: Portable archive. Extract anywhere and run `FastMirror.exe` without installation.

            ### Note on Windows SmartScreen
            FastMirror is an open-source tool without an expensive commercial code-signing certificate. Windows SmartScreen may show a prompt:
            1. Click **More info**.
            2. Click **Run anyway**.

